name: Simple Icons liveness

# Weekly CDN probe of every mapped Simple Icons slug. Not a per-PR gate:
# the check is network-bound and would flake independent of the diff.
# Cross-checks web/Swift/Kotlin maps for drift (issue #37 / PR #65).
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch: {}

concurrency:
  group: simpleicons-liveness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Probe mapped slugs against cdn.simpleicons.org
        run: |
          python3 << 'PY'
          import re, subprocess, time, urllib.parse
          from pathlib import Path

          files = [
              Path("web/src/engine/logos.ts"),
              Path("Sources/ContactLogoKit/Sources/SimpleIconsSource.swift"),
              Path("Apps/ContactLogoAndroid/app/src/main/java/com/contactlogo/engine/SimpleIcons.kt"),
          ]

          pair_re = re.compile(
              r'"([a-z0-9.-]+\.[a-z]{2,})"(?:\s*:\s*|\s+to\s+)"([^"]+)"'
          )
          maps = []
          for path in files:
              text = path.read_text()
              pairs = dict(pair_re.findall(text))
              if not pairs:
                  raise SystemExit(f"no domain->slug pairs parsed from {path}")
              maps.append((path, pairs))
              print(f"parsed {len(pairs)} mappings from {path}")

          # The three engines must stay in lockstep (issue #37).
          base_path, base = maps[0]
          drift = False
          for path, pairs in maps[1:]:
              if pairs != base:
                  only_here = sorted(set(pairs) - set(base))
                  only_base = sorted(set(base) - set(pairs))
                  value_diff = sorted(
                      d for d in set(base) & set(pairs) if base[d] != pairs[d]
                  )
                  print(f"MAP DRIFT {path} vs {base_path}")
                  if only_here:
                      print(f"  extra domains: {only_here}")
                  if only_base:
                      print(f"  missing domains: {only_base}")
                  for d in value_diff:
                      print(f"  {d}: {path}={pairs[d]!r} {base_path}={base[d]!r}")
                  drift = True
          if drift:
              raise SystemExit("Simple Icons maps are not identical across engines")

          slugs = sorted(set(base.values()))
          print(f"unique slugs: {len(slugs)}")

          def probe(slug):
              encoded = urllib.parse.quote(slug, safe="")
              url = f"https://cdn.simpleicons.org/{encoded}"
              last = "000"
              for attempt in range(3):
                  try:
                      r = subprocess.run(
                          [
                              "curl", "-sS", "-o", "/dev/null",
                              "-w", "%{http_code}",
                              "-L", "--max-time", "20",
                              url,
                          ],
                          capture_output=True,
                          text=True,
                          timeout=25,
                      )
                      code = (r.stdout or "").strip() or "000"
                      last = code
                      if code in ("200", "404"):
                          return code
                  except Exception:
                      last = "000"
                  time.sleep(0.5 * (attempt + 1))
              return last

          dead = []
          flake = []
          ok = 0
          for slug in slugs:
              code = probe(slug)
              print(f"{code} {slug}")
              if code == "200":
                  ok += 1
              elif code == "404":
                  dead.append(slug)
              else:
                  # Network flake: do not fail the job for this slug.
                  flake.append((slug, code))

          print(f"OK {ok}  404 {len(dead)}  FLAKE {len(flake)}")
          if flake:
              print("flakes (ignored): " + ", ".join(f"{s}:{c}" for s, c in flake))
          if dead:
              print("dead slugs: " + ", ".join(dead))
              raise SystemExit(f"{len(dead)} mapped Simple Icons slug(s) 404")
          PY
